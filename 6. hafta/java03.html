<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script type="text/javascript">
    //tanımlamalar
    var txt1, txt2, sayi1, sayi2;
    txt1="Kaybettiğin tek savaş";
    txt2="uğruna savaşmaktan vazgeçtiğindir <br>";
    sayi1 = 18;
    sayi2 = 9;
    //işlemler
    var toplamaSonuc = sayi1 + sayi2;
    var cikarmaSonuc = sayi1 - sayi2;
    var birlesim = txt1 + " " + txt2;
    var modSonucu = sayi1 % sayi2;
    //ekrana yazdırma
    document.write(txt1 + " " + txt2)
    document.write(birlesim);
    document.write("sayi1 --> " + sayi1 + "<br>" + "sayi2 --> " + sayi2 + "<br>");
    document.write("sayi1 + sayi2 sonucu: " + (sayi1 + sayi2) + "<br>");
    document.write("sayi1 - sayi2 sonucu:  " + cikarmaSonuc + "<br>");
    document.write("sayi1 % sayi2 sonucu:  " + modSonucu + "<br>");
    document.write(sayi1 + " + " + sayi2 + " = " + toplamaSonuc);
    //alt satıra geçme <br>
    document.write("<br>");
    document.write("<br>");

    var x;
    x=5+5;
    document.write(x);
    document.write("<br>");
    x ="5"+"5";
    document.write(x);
    document.write("<br>");
    x=5+"5";
    document.write(x);
    document.write("<br>"); 
    x="5"+5;
    document.write(x);
</script>
</head>

</body>
</html>
